{% extends "base.html" %}
{% block title %}谱例 · 丝桐课{% endblock %}
{% block content %}
<h1>谱例</h1>
<p class="muted">谱例与音频。无音频授权时仍可完整阅读减字谱文本；播放需登录并取得服务端授权的缓存键。</p>
<div id="list" class="cards"><p class="muted">加载中…</p></div>
<script>
API.get('/api/scores').then(rows => {
  document.getElementById('list').innerHTML = rows.map(s =>
    '<a class="card" href="/scores/' + s.id + '"><h3>《' + esc(s.title) + '》' +
    '<span class="tag">' + esc(s.version || '未发布') + '</span></h3>' +
    '<p class="small muted">' + esc(s.attribution || '') + '</p>' +
    '<p class="small">' + esc((s.intro || '').slice(0, 90)) + '…</p></a>').join('');
}).catch(e => document.getElementById('list').innerHTML = '<div class="alert err">' + esc(e.message) + '</div>');
</script>
{% endblock %}
