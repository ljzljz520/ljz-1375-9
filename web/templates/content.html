{% extends "base.html" %}
{% block title %}{{ title }} · 丝桐课{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<div id="list" class="cards"><p class="muted">加载中…</p></div>
<script>
(function(){
  const page = {{ page|tojson }};
  async function load(){
    const data = await API.get('/api/content/' + page);
    const box = document.getElementById('list');
    if (page === 'history') {
      box.innerHTML = data.map(h =>
        '<div class="card"><span class="era">' + esc(h.era) + '</span>' +
        '<h3>' + esc(h.title) + '</h3><p>' + esc(h.body) + '</p></div>').join('');
    } else {
      box.innerHTML = data.map(s =>
        '<div class="card"><h3>' + esc(s.name) +
        (s.region ? ' <span class="tag">' + esc(s.region) + '</span>' : '') + '</h3>' +
        '<p>' + esc(s.summary) + '</p>' +
        (s.traits ? '<p class="small muted">风格：' + esc(s.traits) + '</p>' : '') +
        '</div>').join('');
    }
  }
  load().catch(e => document.getElementById('list').innerHTML =
    '<div class="alert err">加载失败：' + esc(e.message) + '</div>');
})();
</script>
{% endblock %}
